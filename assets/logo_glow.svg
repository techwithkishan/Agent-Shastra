<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#090912" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>

    <!-- Accent Indigo/Cyan Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Emerald Success Ticker Gradient -->
    <linearGradient id="success-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Radial Glow and Blur Filters -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    /* KEYFRAME ANIMATIONS */
    @keyframes breathing-glow {
      0%, 100% {
        filter: drop-shadow(0 0 4px rgba(99, 102, 241, 0.4)) drop-shadow(0 0 10px rgba(139, 92, 246, 0.2));
        opacity: 0.85;
      }
      50% {
        filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.8)) drop-shadow(0 0 25px rgba(59, 130, 246, 0.4));
        opacity: 1;
      }
    }

    @keyframes shield-pulse {
      0%, 100% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.5));
      }
      50% {
        transform: scale(1.03) rotate(0.5deg);
        filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.8));
      }
    }

    @keyframes grid-fade {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.24; }
    }

    @keyframes status-blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
    }

    @keyframes flow-line {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    /* ELEMENT CLASS STYLING */
    .bg-rect {
      fill: url(#bg-grad);
      stroke: rgba(99, 102, 241, 0.15);
      stroke-width: 1.5;
    }

    .telemetry-grid {
      animation: grid-fade 8s ease-in-out infinite;
    }

    .shield-emblem {
      transform-origin: 140px 140px;
      animation: shield-pulse 6s ease-in-out infinite;
    }

    .glow-title {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      letter-spacing: 12px;
      fill: #ffffff;
      animation: breathing-glow 4s ease-in-out infinite;
    }

    .sub-caption {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 4px;
      fill: #94a3b8;
    }

    .ticker-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      letter-spacing: 2px;
      fill: #10b981;
    }

    .ticker-led {
      fill: #10b981;
      animation: status-blink 2s ease-in-out infinite;
    }

    .flow-connector {
      stroke: #6366f1;
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
      animation: flow-line 2s linear infinite;
    }
  </style>

  <!-- 1. Background Container -->
  <rect width="100%" height="100%" rx="16" class="bg-rect" />

  <!-- 2. Ambient Light Leak in Background -->
  <circle cx="140" cy="140" r="100" fill="#6366f1" opacity="0.08" filter="url(#soft-glow)" />
  <circle cx="500" cy="140" r="180" fill="#3b82f6" opacity="0.04" filter="url(#soft-glow)" />

  <!-- 3. Dynamic Grid Lines -->
  <g class="telemetry-grid">
    <path d="M 0,40 L 800,40 M 0,80 L 800,80 M 0,120 L 800,120 M 0,160 L 800,160 M 0,200 L 800,200 M 0,240 L 800,240" stroke="rgba(99, 102, 241, 0.08)" stroke-width="0.75" />
    <path d="M 80,0 L 80,280 M 160,0 L 160,280 M 240,0 L 240,280 M 320,0 L 320,280 M 400,0 L 400,280 M 480,0 L 480,280 M 560,0 L 560,280 M 640,0 L 640,280 M 720,0 L 720,280" stroke="rgba(99, 102, 241, 0.08)" stroke-width="0.75" />
  </g>

  <!-- 4. Glowing Left Panel: SRE Gateway Node Emblem -->
  <g class="shield-emblem">
    <!-- Outer Hex Shield Boundary -->
    <polygon points="140,55 210,95 210,175 140,215 70,175 70,95" fill="rgba(15, 23, 42, 0.6)" stroke="url(#primary-grad)" stroke-width="2.5" />
    <polygon points="140,65 198,100 198,170 140,205 82,170 82,100" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.25" />

    <!-- Core Connection Grid Node Lines -->
    <line x1="140" y1="65" x2="140" y2="135" class="flow-connector" />
    <line x1="82" y1="170" x2="140" y2="135" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <line x1="198" y1="170" x2="140" y2="135" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />

    <!-- Glowing Gateway Node Points -->
    <!-- Gateway (Top Node) -->
    <circle cx="140" cy="65" r="7" fill="#6366f1" filter="url(#core-glow)" />
    <circle cx="140" cy="65" r="3" fill="#ffffff" />

    <!-- Auth Service (Bottom Left Node) -->
    <circle cx="82" cy="170" r="7" fill="#ef4444" filter="url(#core-glow)" />
    <circle cx="82" cy="170" r="3" fill="#ffffff" />

    <!-- Payment API (Bottom Right Node) -->
    <circle cx="198" cy="170" r="7" fill="#10b981" filter="url(#core-glow)" />
    <circle cx="198" cy="170" r="3" fill="#ffffff" />

    <!-- SRE Diagnostician Core (Center Hub Node) -->
    <circle cx="140" cy="135" r="12" fill="#8b5cf6" filter="url(#core-glow)" />
    <circle cx="140" cy="135" r="5" fill="#ffffff" />
  </g>

  <!-- 5. Sleek Divider Ticker -->
  <line x1="260" y1="65" x2="260" y2="215" stroke="rgba(99, 102, 241, 0.25)" stroke-width="2.5" stroke-linecap="round" />

  <!-- 6. Branding & Typography Section -->
  <g transform="translate(290, 80)">
    <!-- Primary Title: AGENT SHASTRA -->
    <text x="0" y="25" class="glow-title" font-size="28">AGENT SHASTRA</text>

    <!-- Sub-caption: Scope and Purpose -->
    <text x="0" y="55" class="sub-caption" font-size="11.5">INTELLIGENT SRE TELEMETRY DIAGNOSTIC KERNEL</text>

    <!-- Cyberpunk Terminal Details -->
    <g transform="translate(0, 85)">
      <!-- Panel Base Grid -->
      <rect width="440" height="42" rx="6" fill="rgba(15, 23, 42, 0.4)" stroke="rgba(99, 102, 241, 0.12)" stroke-width="1.5" />
      
      <!-- System LED Status Indicator -->
      <circle cx="20" cy="21" r="5.5" class="ticker-led" />
      <circle cx="20" cy="21" r="2.5" fill="#ffffff" />
      
      <!-- System Log Feed -->
      <text x="38" y="26" class="ticker-text" font-size="10.5">STATUS: ACTIVE // AUTO-ISOLATED NOISE CLEANUP</text>
      
      <!-- Sub-tag details -->
      <text x="350" y="25" font-family="Courier New" font-size="9" fill="rgba(99, 102, 241, 0.6)" font-weight="bold">v1.0.4 // SECURE</text>
    </g>
  </g>
</svg>
